<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/normalize.css" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <title>Mesto</title>
  </head>
  <body class="page">
    <section class="popup-image">
      <div class="popup-image__container">
        <button type="button" class="popup-image__button">
          <img class="popup__close-icon" src="/images/popup/Close Icon.svg" alt="" />
        </button>
        <img src="" alt="" class="popup-image__picture" />
        <p class="popup-image__signature"></p>
      </div>
    </section>
    <section class="popup">
      <form class="popup__container" action="">
        <button type="button" class="popup__button">
          <img class="popup__close-icon" src="/images/popup/Close Icon.svg" alt="" />
        </button>
        <h2 class="popup__header">Редактировать профиль</h2>
        <div class="popup__inputs">
          <div>
            <input
              id="input-name"
              class="popup__input popup__input-name"
              type="activity"
              minlength="2"
              maxlength="40"
              placeholder="Имя"
              required
            />
            <span class="popup__input-error input-name-error"></span>
          </div>
          <div>
            <input
              id="input-activity"
              class="popup__input popup__input-activity"
              type="text"
              minlength="2"
              maxlength="200"
              placeholder="Род деятельности"
              required
            />
            <span class="popup__input_error input-activity-error"></span>
          </div>
        </div>
        <button class="popup__form-button" type="submit">Сохранить</button>
      </form>
    </section>
    <section class="popup-add">
      <form class="popup-add__container" action="">
        <button type="button" class="popup-add__button">
          <img class="popup-add__close-icon" src="/images/popup/Close Icon.svg" alt="" />
        </button>
        <h2 class="popup-add__header">Новое место</h2>
        <div class="popup-add__inputs">
          <div>
            <input
              id="input_add-name"
              class="popup-add__input popup-add__input-name"
              type="text"
              placeholder="Название"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="popup__input_error input_add-name-error"></span>
          </div>
          <div>
            <input
              id="input_add-link"
              class="popup-add__input popup-add__input-link"
              type="url"
              placeholder="Ссылка на картинку"
              required
            />
            <span class="popup__input_error input_add-link-error"></span>
          </div>
        </div>
        <button class="popup-add__form-button popup__button_disabled" type="submit">Создать</button>
      </form>
    </section>
    <header class="header">
      <img class="header__logo" src="/images/header/header-logo.svg" alt="" />
    </header>
    <section class="profile">
      <div class="profile__intro">
        <img class="intro__image" src="/images/Profile/Avatar-image.svg" alt="" />
        <div class="intro__text">
          <div class="intro__name-button">
            <h2 class="intro__name">Жак-Ив Кусто</h2>
            <button class="intro__button"></button>
          </div>
          <p class="intro__activity">Исследователь океана</p>
        </div>
      </div>
      <button class="profile__button"></button>
    </section>
    <section class="elements">
      <template id="rectangle-template">
        <div class="rectangle">
          <img alt="" class="rectangle__image" />
          <div class="rectangle__text-part">
            <h2 class="rectangle__header"></h2>
            <button class="rectangle__button"></button>
          </div>
          <button class="rectangle__delete-button"></button>
        </div>
      </template>
    </section>
    <section class="footer">
      <p class="footer__copyright">&copy; 2026 Mesto Russia</p>
    </section>
    <script type="module" src="/scripts/index.js"></script>
  </body>
</html>
