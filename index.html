<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/normalize.css" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <title>Mesto</title>
  </head>
  <body class="page">
    <section class="popup">
      <form class="popup__container" action="">
        <button type="button" class="popup__button">
          <img class="popup__close-icon" src="/images/popup/Close Icon.svg" alt="" />
        </button>
        <h2 class="popup__header">Редактировать профиль</h2>
        <div class="popup__inputs">
          <div>
            <input class="popup__input popup__input-name" type="text" />
          </div>
          <div>
            <input class="popup__input popup__input-activity" type="text" />
          </div>
        </div>
        <button class="popup__form-button" type="submit">Сохранить</button>
      </form>
    </section>
    <section class="popup-add">
      <form class="popup-add__container" action="">
        <button type="button" class="popup-add__button">
          <img class="popup-add__close-icon" src="/images/popup/Close Icon.svg" alt="" />
        </button>
        <h2 class="popup-add__header">Новое место</h2>
        <div class="popup-add__inputs">
          <div>
            <input class="popup-add__input popup-add__input-name" type="text" placeholder="Название" />
          </div>
          <div>
            <input class="popup-add__input popup-add__input-link" type="text" placeholder="Ссылка на картинку" />
          </div>
        </div>
        <button class="popup-add__form-button" type="submit">Создать</button>
      </form>
    </section>
    <header class="header">
      <img class="header__logo" src="/images/header/header-logo.svg" alt="" />
    </header>
    <section class="profile">
      <div class="profile__intro">
        <img class="intro__image" src="/images/Profile/Avatar-image.svg" alt="" />
        <div class="intro__text">
          <div class="intro__name-button">
            <h2 class="intro__name">Жак-Ив Кусто</h2>
            <button class="intro__button"></button>
          </div>
          <p class="intro__activity">Исследователь океана</p>
        </div>
      </div>
      <button class="profile__button"></button>
    </section>
    <section class="elements">
      <template id="rectangle-template">
        <div class="rectangle">
          <img alt="" class="rectangle__image" />
          <div class="rectangle__text-part">
            <h2 class="rectangle__header"></h2>
            <button class="rectangle__button">
              <img class="rectangle__button-image" src="/images/Elements/button__image.svg" alt="" />
            </button>
          </div>
        </div>
      </template>
    </section>
    <section class="footer">
      <p class="footer__copyright">&copy; 2026 Mesto Russia</p>
    </section>
    <script src="/scripts/script.js"></script>
  </body>
</html>
